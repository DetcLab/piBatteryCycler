<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PI BATTERY CYCLER V1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main>
  <header>
    <h1>PI BATTERY CYCLER V1.0</h1>
    <span id="estado">Conectando…</span>
  </header>

  <section class="tarjetas">
    <article class="tarjeta v"><h2>Tensión</h2><span class="valor" id="val-v">--</span><span class="unidad">V</span></article>
    <article class="tarjeta i"><h2>Intensidad</h2><span class="valor" id="val-i">--</span><span class="unidad">A</span></article>
    <article class="tarjeta t"><h2>Temperatura</h2><span class="valor" id="val-t">--</span><span class="unidad">°C</span></article>
  </section>

  <section class="control" aria-labelledby="tit-control">
    <div class="control-cab">
      <h3 id="tit-control">Control</h3>
      <span id="modo-txt" data-modo="paro">En paro</span>
      <span id="nivel"></span>
      <p id="aviso" role="status"></p>
    </div>
    <div class="campos">
      <div class="campo"><label for="i-carga">Intensidad de carga (A)</label><input id="i-carga" type="number" min="0.1" max="10" step="0.1" value="1"></div>
      <div class="campo"><label for="i-descarga">Intensidad de descarga (A)</label><input id="i-descarga" type="number" min="0.1" max="10" step="0.1" value="1"></div>
      <div class="campo"><label for="vmax">Tensión máxima (V)</label><input id="vmax" type="number" min="3.5" max="4.25" step="0.01" value="4.2"></div>
      <div class="campo"><label for="vmin">Tensión mínima (V)</label><input id="vmin" type="number" min="2.5" max="3.6" step="0.01" value="3"></div>
    </div>
    <div class="botones">
      <button type="button" data-modo="carga" aria-pressed="false">Cargar</button>
      <button type="button" data-modo="descarga" aria-pressed="false">Descargar</button>
      <button type="button" data-modo="paro" aria-pressed="true">Paro</button>
    </div>
  </section>

  <section class="grafica">
    <h3>Tensión e intensidad</h3>
    <div class="lienzo"><canvas id="g-vi"></canvas></div>
  </section>

  <section class="grafica">
    <h3>Temperatura</h3>
    <div class="lienzo"><canvas id="g-t"></canvas></div>
  </section>

  <section class="secuencia" aria-labelledby="tit-seq">
    <div class="seq-cab">
      <h3 id="tit-seq">Secuencia</h3>
      <label class="unidad-sel">Tiempo en
        <select id="seq-unidad" aria-label="Unidad de tiempo">
          <option value="1">segundos</option>
          <option value="60">minutos</option>
          <option value="3600">horas</option>
        </select>
      </label>
    </div>
    <div class="fila cab"><span></span><span>Modo</span><span>Intensidad (A)</span><span>Tiempo</span></div>
    <div id="seq-filas"></div>
    <div class="seq-pie">
      <button type="button" id="seq-ejecutar">Ejecutar secuencia</button>
      <button type="button" id="seq-detener" disabled>Detener</button>
      <span id="seq-estado">Secuencia detenida</span>
      <p id="seq-aviso" role="status"></p>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
